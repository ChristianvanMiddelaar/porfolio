<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Document</title>
</head>

<body class="contactpage">
    <div class="contactinfo">
        <div class="nametext">
            <label for="name">name:</label>
            <input type="text" id="name" name="name" required placeholder="jouw naam">
        </div>
        <div class="emailtext">
            <label for="email">email:</label>
            <input type="email" id="email" name="email" required placeholder="naam@email.nl">
        </div>
        <div class="messagetext">
            <label for="message">message:</label>
            <textarea id="message" name="message" placeholder="type here"></textarea>
        </div>
        <div>
        <input class="submitbutton" type="submit" id="submit" name="submit">
        </div>
    </div>
</body>

</html>
